# Everything a change must pass, without a disc: `cargo xtask ci` (format,
# clippy, rustdoc, tests including the recompiled conformance program,
# cargo deny, dependency rules), on Linux and on Windows. Tests that need
# the user's discs stay local (`cargo xtask test-full`, `cargo xtask recomp
# sly1 --check`).
#
# Actions are pinned to commits; the comment names the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: cargo xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # gilrs (gamepads) needs libudev, cpal (sound) ALSA.
      - name: Install the system libraries the app links
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev libasound2-dev pkg-config
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo xtask ci
