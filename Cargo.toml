[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Our crates.
ps2-disc = { path = "crates/ps2-disc" }
ps2-isa = { path = "crates/ps2-isa" }
sly-common = { path = "crates/sly-common" }

# Third-party crates: few, mainstream, audited by `cargo deny` (deny.toml).
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Benchmarks only.
divan = "0.1.21"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
# Reference R5900 decoder, for tests only (ps2-isa is checked against it).
rabbitizer = { version = "=2.0.0-alpha.9", default-features = false, features = ["R5900EE", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
print_stderr = "warn"
dbg_macro = "deny"
todo = "warn"
# Noisy for this codebase's naming (ps2_disc::DiscError and the like).
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
debug = "line-tables-only"

# `cargo build --profile profiling`: release speed with full debug info for profilers.
[profile.profiling]
inherits = "release"
debug = true

# `cargo build --profile dist`: what gets shipped. Whole-program optimisation and no debug
# info (sly-rs info: 12.5 MB with release's line tables, 2.0 MB stripped).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = true
