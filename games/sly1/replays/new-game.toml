# Sly 1 from power-on: the title (attract world), a new game, the first
# level (jb_intro). Our own input script; checkpoints are the game state's
# world and level (decompilation: include/game.h) and sly-rs's state hash.
game = "sly1"
fields = 2000
presses = ["start@300", "start@500", "cross@700", "start@900"]

