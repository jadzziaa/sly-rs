# Sly 1 from power-on: the "no memory card" dialog (attract world), the
# title over the first level (jb_intro), Start for a new game (taken at
# 2000 only after the press at 1600), and the
# level's intro (Bentley on the binocucom, confirmed by screenshot). Our own
# input script; checkpoints are the game state's world and level
# (decompilation: include/game.h) and sly-rs's state hash.
game = "sly1"
fields = 2600
presses = ["start@300", "start@500", "cross@700", "start@1600", "start@2000"]

[[checkpoint]]
field = 600
world = 0
level = 2
hash = "9d449f28d8fd6eb2"

[[checkpoint]]
field = 1500
world = 0
level = 3
hash = "34c6ef7c0e31e227"

[[checkpoint]]
field = 2600
world = 0
level = 3
hash = "a557570a6059ebd9"
